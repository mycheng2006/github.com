<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>高考倒计时</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #05070c;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* 背景柔光 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(900px 620px at 50% -12%, rgba(64,132,255,.30), transparent 70%),
      radial-gradient(760px 520px at 88% 112%, rgba(122,80,255,.22), transparent 72%),
      radial-gradient(640px 420px at 8% 104%, rgba(0,200,255,.14), transparent 72%);
    pointer-events: none;
  }

  .app {
    position: relative;
    z-index: 1;
    width: 100%;
    padding: 0 4vw;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(10px, 2.4vh, 40px);
    text-align: center;
  }

  /* 顶部标题 */
  .title {
    font-size: clamp(0.85rem, 1.8vw, 1.5rem);
    letter-spacing: .25em;
    text-indent: .25em;
    color: rgba(190, 215, 255, .78);
    font-weight: 400;
    animation: breathe 3.6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: .55; }
    50%      { opacity: 1; }
  }

  /* 倒计时区域 */
  .countdown {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: center;
    gap: clamp(8px, 2.5vw, 56px);
  }

  .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(4px, .8vh, 14px);
  }

  /* 倒计时数字：蓝白渐变 */
  .num {
    font-size: clamp(2rem, 9vw, 8.5rem);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
    background: linear-gradient(180deg, #ffffff 0%, #cfe6ff 50%, #5fa8ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    filter: drop-shadow(0 0 26px rgba(80, 150, 255, .38));
  }

  .label {
    font-size: clamp(.7rem, 1.6vw, 1.3rem);
    color: rgba(160, 190, 230, .68);
    letter-spacing: .2em;
    text-indent: .2em;
  }

  /* 底部当前时间 */
  .clock {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(2px, .6vh, 10px);
  }

  .clock-date {
    font-size: clamp(.8rem, 1.6vw, 1.3rem);
    color: rgba(255, 255, 255, .5);
    letter-spacing: .12em;
    text-indent: .12em;
    font-variant-numeric: tabular-nums;
  }

  /* 时分秒：字号与倒计时完全一致，颜色改为暖金色 */
  .clock-time {
    font-size: clamp(2rem, 9vw, 8.5rem);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -.02em;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
    background: linear-gradient(180deg, #fff5d6 0%, #ffce5c 50%, #ff9b21 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    filter: drop-shadow(0 0 26px rgba(255, 170, 60, .40));
  }
</style>
</head>
<body>

  <div class="app">
    <div class="title" id="title">距离高考还有</div>

    <div class="countdown">
      <div class="unit"><div class="num" id="days">0</div><div class="label">天</div></div>
      <div class="unit"><div class="num" id="hours">00</div><div class="label">时</div></div>
      <div class="unit"><div class="num" id="minutes">00</div><div class="label">分</div></div>
      <div class="unit"><div class="num" id="seconds">00</div><div class="label">秒</div></div>
    </div>

    <div class="clock">
      <div class="clock-date" id="clockDate">--</div>
      <div class="clock-time" id="clockTime">--:--:--</div>
    </div>
  </div>

<script>
(function () {
  /* ============ 可修改配置 ============ */
  const MONTH  = 6;   // 高考月份
  const DAY    = 7;   // 高考日期
  const HOUR   = 9;   // 第一科开考时间（小时）
  const MINUTE = 0;   // 开考分钟
  /* ==================================== */

  const WEEK = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  const $ = id => document.getElementById(id);
  const el = {
    title:     $('title'),
    days:      $('days'),
    hours:     $('hours'),
    minutes:   $('minutes'),
    seconds:   $('seconds'),
    clockDate: $('clockDate'),
    clockTime: $('clockTime')
  };

  const pad = (n, len = 2) => String(n).padStart(len, '0');

  /* 计算目标时间：今年已过则自动顺延到明年 */
  function getTarget(now) {
    let year = now.getFullYear();
    let t = new Date(year, MONTH - 1, DAY, HOUR, MINUTE, 0, 0);
    if (t.getTime() <= now.getTime()) {
      year += 1;
      t = new Date(year, MONTH - 1, DAY, HOUR, MINUTE, 0, 0);
    }
    return t;
  }

  let target = getTarget(new Date());
  el.title.textContent = '距离 ' + target.getFullYear() + ' 年高考还有';

  function render() {
    const now = new Date();

    // 跨过考试时间后自动切换到下一年
    if (now.getTime() >= target.getTime()) {
      target = getTarget(now);
      el.title.textContent = '距离 ' + target.getFullYear() + ' 年高考还有';
    }

    const diff  = Math.max(0, target.getTime() - now.getTime());
    const total = Math.floor(diff / 1000);

    el.days.textContent    = Math.floor(total / 86400);
    el.hours.textContent   = pad(Math.floor(total % 86400 / 3600));
    el.minutes.textContent = pad(Math.floor(total % 3600 / 60));
    el.seconds.textContent = pad(total % 60);

    // 日期 + 星期
    el.clockDate.textContent =
      now.getFullYear() + '年' + pad(now.getMonth() + 1) + '月' + pad(now.getDate()) + '日 ' +
      WEEK[now.getDay()];

    // 时分秒
    el.clockTime.textContent =
      pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
  }

  /* 对齐到整秒，避免时间累积漂移 */
  function loop() {
    render();
    setTimeout(loop, 1000 - (Date.now() % 1000));
  }

  render();
  loop();
})();
</script>
</body>
</html>
